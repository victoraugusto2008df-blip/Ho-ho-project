services:
  postgres:
    image: postgres:16-alpine
    container_name: shopping-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopping_hub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shopping_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopping-network

  frontend:
    build: ./frontend
    container_name: shopping-hub-frontend
    profiles: ["front"]
    environment:
      # "true" = login simulado, sem backend (ORD-02). Use VITE_AUTH_MOCK=false para o backend real.
      VITE_AUTH_MOCK: ${VITE_AUTH_MOCK:-true}
    ports:
      - "5173:5173"
    networks:
      - shopping-network

volumes:
  postgres_data:

networks:
  shopping-network:
    driver: bridge

