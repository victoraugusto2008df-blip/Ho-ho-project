name: CI — Shopping Hub

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-flow-gate:
    name: Git Flow Policy Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Validate PR source branch for main
        run: |
          echo "Base branch de destino: ${{ github.base_ref }}"
          echo "Head branch de origem: ${{ github.head_ref }}"
          case "${{ github.head_ref }}" in
            develop|feat/*|feature/*)
              echo "PR validado para 'main': origem '${{ github.head_ref }}'."
              ;;
            *)
              echo "::error::Violacao de fluxo Git! Pull Requests para a branch 'main' devem vir de 'develop', 'feat/*' ou 'feature/*'."
              exit 1
              ;;
          esac

  backend:
    name: Backend (Java 21 + Maven + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DOCKER_API_VERSION: '1.44'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Ensure Maven Wrapper is executable
        run: chmod +x ./mvnw

      - name: Run tests and package (Maven verify)
        run: ./mvnw -B verify

  frontend:
    name: Frontend (React + Vite + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies cleanly
        run: npm ci

      - name: Typecheck and build production bundle
        run: npm run build

  docker-compose:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml with .env.example
        run: docker compose --env-file .env.example config -q
